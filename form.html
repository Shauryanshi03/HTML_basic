<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="name">Name:</label>
        <input type="text" required> <br>
        <label for="class">Class:</label>
        <input type="number"> <br>
        <label for="email">Email:</label>
        <input type="email" placeholder="example@gmail.com"> <br>
        <label for="password">Password:</label>
        <input type="password" name="" id=""> <br>
        <label for="mobile no">Mobile no.</label>
        <input type="tel"> <br>
        <label for="link">Portfolio Link:</label>
        <input type="url"> <br>
        <label for="">Select file:</label>
        <input type="file"> <br>
        <label for="">Select image:</label>
        <input type="image" src> <br>
        <label for="">DOB:</label>
        <input type="date" name="" id=""> <br>
        <label for="time">Appointment time:</label>
        <input type="time"> <br>
        <label for="">Date and Time:</label>
        <input type="datetime-local"> <br>
        <label for="">Month:</label>
        <input type="month"> <br>
        <label for="">Week:</label>
        <input type="week"> <br>
        <label for="">Select your hobbies:</label>
        <input type="checkbox">Reading Books
        <input type="checkbox">Singing
        <input type="checkbox">Dancing
        <input type="checkbox">Riding Bikes <br>
        <label for="">Gender:</label>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
        <input type="radio" name="gender">Others <br>
        <label for="">Description:</label>
        <textarea name="description"></textarea> <br>
        <label for="colour">Favourite colour:</label>
        <input type="color"> <br>
        <label for="range">Range:</label>
        <input type="range"> <br>
        <input type="submit">
        <input type="reset">
        <button>Button</button>
        <input type="button" value="Click me!">
        <input type="button" value="Print" onclick="window.print();">
    </form>
</body>
</html>
