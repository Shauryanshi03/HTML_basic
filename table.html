<!DOCTYPE html>
<html>
    <head><title>Table</title></head>
    <body>
        <h2>Table in HTML</h2>
        <table border="5px" height="80px" width="80px" bgcolor="lightgray" cellspacing="5" cellpadding="10">
            <caption align="bottom">Time Table</caption>
            <tr>
                <th>Sr.No</th>
                <th>Name</th>
                <th>Roll No</th>
                <th>Class</th>
                <th>Course</th>
                <th colspan="2">Average</th>
                <th>Day</th>
            </tr>
            <tr>
                <td>1.</td>
                <td>Tom</td>
                <td>22</td>
                <td>5th</td>
                <td>B.Tech</td>
                <td>Height</td>
                <td>Weight</td>
                <td rowspan="3">Monday</td>
            </tr>
            <tr>
                <td>2.</td>
                <td>Jimmy</td>
                <td>27</td>
                <td>8th</td>
                <td>BCA</td>
            </tr>
            <tr>
                <td>3.</td>
                <td>John</td>
                <td>12</td>
                <td>6th</td>
                <td>MCA</td>
            </tr>
        </table>

    </body>
</html>
